version: 1
disable_existing_loggers: false

formatters:
  default:
    format: "[%(asctime)s] [%(levelname)s] [%(name)s] %(message)s"

handlers:
  file:
    class: logging.handlers.RotatingFileHandler
    filename: logs/openwebui.log
    maxBytes: 10485760   # 10MB
    backupCount: 5
    formatter: default
    level: INFO

  console:
    class: logging.StreamHandler
    formatter: default
    level: INFO

loggers:
  uvicorn:
    handlers: [console, file]
    level: INFO
    propagate: false

  uvicorn.error:
    handlers: [console, file]
    level: INFO
    propagate: false

  uvicorn.access:
    handlers: [console, file]
    level: INFO
    propagate: false

  open_webui:
    handlers: [console, file]
    level: INFO
    propagate: false

root:
  handlers: [console, file]
  level: INFO